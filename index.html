<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>I’m Really Sorry 💙</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(-45deg, #1e3c72, #2a5298, #6dd5fa, #2980b9);
  background-size: 400% 400%;
  animation: gradientBG 10s ease infinite;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  color: white;
}

@keyframes gradientBG {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}

.container {
  text-align: center;
  padding: 40px;
  border-radius: 20px;
  backdrop-filter: blur(12px);
  background: rgba(255,255,255,0.1);
  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  max-width: 450px;
}

h1 {
  font-size: 42px;
  margin-bottom: 10px;
}

#typedText {
  font-size: 18px;
  min-height: 80px;
  margin: 20px 0;
}

button {
  margin: 10px;
  padding: 12px 20px;
  border: none;
  border-radius: 30px;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

.yes {
  background: #00ffcc;
  color: black;
}

.no {
  background: #ff4d4d;
  color: white;
  position: relative;
}

button:hover {
  transform: scale(1.1);
}

.heart {
  font-size: 50px;
  animation: beat 1s infinite;
}

@keyframes beat {
  0%,100% {transform: scale(1);}
  50% {transform: scale(1.3);}
}

#finalMsg {
  margin-top: 20px;
  font-size: 20px;
  display: none;
}
</style>

</head>
<body>

<div class="container">
  <div class="heart">🙏</div>
  <h1>I'm Sorry</h1>
  <div id="typedText"></div>

  <button class="yes" onclick="forgive()">Forgive Me 💙</button>
  <button class="no" onmouseover="moveBtn(this)">Not Yet 😢</button>

  <div id="finalMsg">You made me the happiest person 🥹💙 Thank you!</div>
</div>

<audio id="bgMusic" loop>
  <source src="https://www.bensound.com/bensound-music/bensound-slowmotion.mp3" type="audio/mp3">
</audio>

<script>
let text = "I’ve been thinking about everything, and I honestly feel really bad. I’m sorry for what I did—it wasn’t right. Soryyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy";
let i = 0;
function typing() {
  if (i < text.length) {
    document.getElementById("typedText").innerHTML += text.charAt(i);
    i++;
    setTimeout(typing, 40);
  }
}
typing();

// move NO button
function moveBtn(btn) {
  btn.style.position = "absolute";
  btn.style.top = Math.random() * 80 + "%";
  btn.style.left = Math.random() * 80 + "%";
}

// forgive button
function forgive() {
  document.getElementById("finalMsg").style.display = "block";
  document.getElementById("bgMusic").play();
}
</script>

</body>
</html>
